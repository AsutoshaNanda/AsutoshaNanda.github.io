<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="4" fill="#0d0e14"/>
  <!-- Outer ring (vessel ring) -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="#c0a060" stroke-width="1.5"/>
  <!-- Inner shell (Knight helm silhouette) -->
  <ellipse cx="16" cy="17" rx="6.5" ry="7" fill="#e8e3d4"/>
  <!-- Horn -->
  <polygon points="16,10 13.5,4 18.5,4" fill="#c8c4b4"/>
  <!-- Eye voids -->
  <ellipse cx="13" cy="17" rx="1.8" ry="2.2" fill="#0d0e14"/>
  <ellipse cx="19" cy="17" rx="1.8" ry="2.2" fill="#0d0e14"/>
  <!-- Soul glow -->
  <ellipse cx="13" cy="17" rx="0.9" ry="1.1" fill="#5bc8f5" opacity="0.85"/>
  <ellipse cx="19" cy="17" rx="0.9" ry="1.1" fill="#5bc8f5" opacity="0.85"/>
  <!-- Notch bottom of shell -->
  <path d="M12 23 Q16 26 20 23" fill="none" stroke="#0a0b10" stroke-width="1"/>
</svg>
